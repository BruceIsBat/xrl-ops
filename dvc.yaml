PYTHON ?= python

.PHONY: install train evaluate dvc-init dvc-add

install:
	$(PYTHON) -m pip install -e ".[dev]"

train:
	$(PYTHON) train.py --timesteps 50000 --model-path artifacts/models/ppo_control_model.zip --seed 42

evaluate:
	$(PYTHON) evaluate.py --episodes 100 --max-steps 500 --model-path artifacts/models/ppo_control_model.zip --benchmark-path artifacts/benchmarks/eval_report.json --seed 42

dvc-init:
	dvc init

dvc-add:
	dvc add artifacts/models artifacts/benchmarks
